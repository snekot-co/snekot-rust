[package]
name = "snekot-events"
version = "0.3.1"
edition = "2021"
description = "Post product events, identify users and set insights with Snekot."
license = "MIT"
readme = "README.md"
homepage = "https://snekot.co"
documentation = "https://docs.rs/snekot-events"
repository = "https://github.com/snekot-co/snekot-rust"
keywords = ["snekot", "events", "analytics", "tracking", "notifications"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
# A client for programs that are not async: `snekot_events::blocking::Client`.
blocking = ["tokio/rt"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
